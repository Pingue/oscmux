version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    assignees:
      - Pingue
    commit-message:
      prefix: "chore(deps-dev)"   # test-only dependencies: no release
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    assignees:
      - Pingue
    commit-message:
      prefix: "fix(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - Pingue
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
