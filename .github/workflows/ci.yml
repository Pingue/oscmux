name: CI

on:
  pull_request:
  push:
    branches-ignore: [master]   # master is tested by the release workflow
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake liblo-dev libefl-all-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          OSCMUX_BIN: build/oscmux

  sanitize:
    # Memory errors (use-after-free, bad free, UB) have already shipped in this
    # code once; run the same tests under AddressSanitizer and UBSan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake liblo-dev libefl-all-dev
      - name: Build with sanitizers
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-san
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          OSCMUX_BIN: build-san/oscmux
          ASAN_OPTIONS: detect_leaks=0   # the tests kill the process, so exit-time leak reports aren't meaningful

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: oscmux:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          # With no arguments oscmux prints its usage and exits 1.
          status=0
          output="$(docker run --rm oscmux:ci 2>&1)" || status=$?
          echo "$output"
          test "$status" -eq 1
          echo "$output" | grep -q '^usage:'
